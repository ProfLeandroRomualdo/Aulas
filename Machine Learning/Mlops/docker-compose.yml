services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1_pit_api
    environment:
      MODEL_PATH: /app/rf_model.joblib
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - mlops_net

  frontend:
    image: nginx:1.27-alpine
    container_name: f1_pit_frontend
    ports:
      - "3000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mlops_net

networks:
  mlops_net:
    driver: bridge
