apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 2 # Vamos rodar 2 cópias da nossa API para testar balanceamento
  selector:
    matchLabels:
      app: api-flask
  template:
    metadata:
      labels:
        app: api-flask
    spec:
      containers:
      - name: api-flask
        image: minha-api-flask:v1
        imagePullPolicy: Never # IMPORTANTE: Diz ao K8s para usar a imagem local
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort # Expõe a porta para acesso externo
  selector:
    app: api-flask
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30001